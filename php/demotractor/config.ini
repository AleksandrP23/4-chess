[demotractor]
; Основные настройки шаблона
template_name = "Demotractor"
template_version = "1.0.0"
template_author = "Your Name"
template_description = "Modern template for UMI.CMS"

; Настройки ресурсов
css_minify = true
js_minify = true
use_gulp = true

; Настройки кэширования
cache_enabled = true
cache_lifetime = 3600

; Специальные страницы
special_pages[] = "market"
special_pages[] = "about"
special_pages[] = "contacts"

; Настройки SEO
default_meta_title = "Default Page Title"
default_meta_description = "Default page description"
default_meta_keywords = "default, keywords"

; Настройки изображений
image_quality = 85
thumbnail_width = 300
thumbnail_height = 200

; Настройки пагинации
items_per_page = 20